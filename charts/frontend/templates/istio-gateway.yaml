{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ default (include "kartshop-frontend.fullname" .) .Values.istio.gatewayName }}
  namespace: {{ .Values.istio.gatewayNamespace }}
  labels:
    {{- include "kartshop-frontend.labels" . | nindent 4 }}
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - {{ .Values.istio.host | quote }}
      {{- if .Values.istio.httpsRedirect }}
      tls:
        httpsRedirect: true
      {{- end }}
{{- end }}
